name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: false

      - name: Test
        run: npm test

      - name: Release invariants (version sync, CHANGELOG, plugin metadata)
        run: node scripts/release-preflight.js --ci

      - name: Build
        run: npm run build

      - name: Security scan (Semgrep)
        run: |
          if [ -f ".semgrep.yml" ]; then
            pip install semgrep
            semgrep --config .semgrep.yml --error --severity ERROR src/
            semgrep --config .semgrep.yml --severity WARNING src/ || true
          fi

      - name: Architecture fitness
        run: npm test
